<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Inclusão, registro e análise dos relatórios das igrejas, no padrão da Igreja Presbiteriana do Brasil.">
  <title>SISTEMA GESTÃO CONCÍLIOS IPB</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libertinus+Sans:ital,wght@0,400;0,700;1,400&display=swap">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#2c5234">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gestão Concílios IPB">
  <link rel="apple-touch-icon" href="icones/icone-180.png">
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="alternate icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 110'%3E%3Cpath d='M20 98h32c24 0 36-18 36-48 0-22-10-32-36-36-20-4-32 2-36 6v72c0 4 2 6 4 6z' fill='%23006B3F'/%3E%3Cpath d='M50 26v18M50 56v28M32 50h12M56 50h14' stroke='%23fff' stroke-width='8.5' stroke-linecap='round'/%3E%3C/svg%3E">
  
  <style>
    :root {
      color-scheme: light;
      /* identidade visual da IPB (Programa de Identidade Visual): verde Pantone 350C e cinza K70;
         letra Zapf Humanist (Optima é o mesmo desenho) e Times New Roman nos demais textos.
         Onde houver Zapf Humanist ou Optima instalada (Mac, iPhone, iPad), ela é usada; nos demais
         aparelhos entra a Libertinus Sans (livre, Google Fonts), do mesmo traço humanista. */
      --brand: #2c5234;          /* verde IPB, Pantone 350C */
      --brand-dark: #1e3b25;
      --brand-soft: #e6eee7;
      --ipb-cinza: #58595b;      /* cinza IPB, K70 */
      --fonte-ipb: 'Zapf Humanist 601 BT', 'Zapf Humanist', Optima, 'Libertinus Sans', 'URW Classico', Candara, 'Segoe UI', sans-serif;
      --fonte-texto: 'Times New Roman', Times, 'Liberation Serif', serif;
      --brand-contrast: #ffffff;
      --bg: #f3f6f4;
      --surface: #ffffff;
      --surface-2: #f7faf8;
      --text: #10201a;
      --text-2: #33453c;
      --muted: #627269;
      --border: #dde6e0;
      --border-strong: #c3d1c8;
      --shadow: 0 1px 3px rgba(16, 32, 26, .07);
      --shadow-lg: 0 24px 48px -16px rgba(16, 32, 26, .35);
      --side-bg: #2c5234;
      --side-text: #ffffff;
      --side-muted: #b9d6c5;
      --side-hover: #3a6744;
      --side-active: #ffffff;
      --side-active-text: #2c5234;
      --danger: #b42318; --danger-soft: #fde9e7;
      --warn: #a15c00; --warn-soft: #fff4e0;
      --info: #1f5fa8; --info-soft: #e8f0fb;
      --ok: #00703c; --ok-soft: #e3f4ea;
      --teal: #0f6f6a; --teal-soft: #e1f3f1;
      --gray: #5b6660; --gray-soft: #eef1ef;
      --radius: 12px; --radius-sm: 8px;
      font-family: var(--fonte-ipb);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        color-scheme: dark;
        --brand: #3fb27a; --brand-dark: #2a8c5c; --brand-soft: rgba(63, 178, 122, .14); --brand-contrast: #04130b;
        --bg: #0c1310; --surface: #131c18; --surface-2: #18231e; --text: #e6efe9; --text-2: #c2d0c7; --muted: #8fa198;
        --border: #24322b; --border-strong: #33463c; --shadow: 0 1px 3px rgba(0,0,0,.4); --shadow-lg: 0 24px 48px -16px rgba(0,0,0,.7);
        --side-bg: #08110d; --side-hover: #12211a; --side-muted: #8fb3a0; --side-active: #3fb27a; --side-active-text: #04130b;
        --danger: #f97066; --danger-soft: rgba(249,112,102,.14); --warn: #fdb022; --warn-soft: rgba(253,176,34,.13);
        --info: #84adff; --info-soft: rgba(132,173,255,.14); --ok: #47cd89; --ok-soft: rgba(71,205,137,.14);
        --teal: #5fd4c9; --teal-soft: rgba(95,212,201,.13); --gray: #a3b0a9; --gray-soft: rgba(163,176,169,.13);
      }
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --brand: #3fb27a; --brand-dark: #2a8c5c; --brand-soft: rgba(63, 178, 122, .14); --brand-contrast: #04130b;
      --bg: #0c1310; --surface: #131c18; --surface-2: #18231e; --text: #e6efe9; --text-2: #c2d0c7; --muted: #8fa198;
      --border: #24322b; --border-strong: #33463c; --shadow: 0 1px 3px rgba(0,0,0,.4); --shadow-lg: 0 24px 48px -16px rgba(0,0,0,.7);
      --side-bg: #08110d; --side-hover: #12211a; --side-muted: #8fb3a0; --side-active: #3fb27a; --side-active-text: #04130b;
      --danger: #f97066; --danger-soft: rgba(249,112,102,.14); --warn: #fdb022; --warn-soft: rgba(253,176,34,.13);
      --info: #84adff; --info-soft: rgba(132,173,255,.14); --ok: #47cd89; --ok-soft: rgba(71,205,137,.14);
      --teal: #5fd4c9; --teal-soft: rgba(95,212,201,.13); --gray: #a3b0a9; --gray-soft: rgba(163,176,169,.13);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); line-height: 1.5; -webkit-font-smoothing: antialiased; min-height: 100vh; overflow-x: hidden; }
    button, input, select, textarea { font: inherit; color: inherit; }
    :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
    a { color: var(--brand); }
    h1, h2, h3, h4 { margin: 0; line-height: 1.25; }
    h1 { font-size: 22px; font-weight: 700; }
    h2 { font-size: 17px; font-weight: 600; }
    h3 { font-size: 15px; font-weight: 600; }
    .muted { color: var(--muted); }
    .small { font-size: 13px; }
    .hidden { display: none !important; }

    /* ---------- layout ---------- */
    .app { display: grid; grid-template-columns: 248px 1fr; min-height: 100vh; }
    .side { background: var(--side-bg); color: var(--side-text); padding: 18px 12px; display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
    .brand { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 14px; padding: 18px 10px 20px; margin-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,.12); color: inherit; text-decoration: none; border-radius: 10px; }
    a.brand:hover { background: var(--side-hover); }
    .brand svg { flex: none; }
    .brand-txt { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; }
    .brand b { display: block; font-size: 13px; line-height: 1.45; letter-spacing: .16em; font-weight: 600; padding-top: 12px; border-top: 1px solid rgba(255,255,255,.22); width: 100%; }
    .brand .brand-org { display: flex; flex-direction: column; align-items: center; gap: 5px; }
    .brand .brand-org i { font-style: normal; font-weight: 700; font-size: 12px; color: #fff; background: rgba(255,255,255,.14); border-radius: 999px; padding: 3px 12px; letter-spacing: .1em; }
    .brand .brand-org em { font-style: normal; font-size: 12px; line-height: 1.35; color: var(--side-muted); }
    .nav-label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--side-muted); padding: 14px 10px 4px; }
    .nav a { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px; color: var(--side-text); text-decoration: none; font-size: 14px; font-weight: 500; }
    .nav a:hover { background: var(--side-hover); }
    .nav a.active { background: var(--side-active); color: var(--side-active-text); }
    .nav a .count { margin-left: auto; background: #fdb022; color: #2b1a00; border-radius: 99px; font-size: 11px; padding: 0 7px; font-weight: 700; }
    .side-foot { margin-top: auto; border-top: 1px solid rgba(255,255,255,.12); padding: 12px 8px 0; font-size: 13px; }
    .side-foot .who b { display: block; }
    .side-foot .who span { color: var(--side-muted); font-size: 12px; }
    .side-foot .row { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
    .side-btn { background: transparent; border: 1px solid rgba(255,255,255,.25); color: var(--side-text); border-radius: 7px; padding: 5px 9px; font-size: 12px; cursor: pointer; }
    .side-btn:hover { background: var(--side-hover); }
    .main { min-width: 0; padding: 24px 28px 60px; }
    .topbar { display: none; }
    .app { transition: grid-template-columns .2s ease; }
    .side-recolher { position: absolute; top: 10px; right: 10px; z-index: 2; width: 28px; height: 28px; border-radius: 8px; border: 1px solid rgba(255,255,255,.25); background: rgba(0,0,0,.12); color: var(--side-text); font-size: 15px; line-height: 1; cursor: pointer; }
    .side-recolher:hover { background: var(--side-hover); }
    .nav a .ni { width: 18px; text-align: center; flex: none; }
    @media (max-width: 820px) { .side-recolher { display: none; } }
    .nav-etq { position: fixed; z-index: 60; transform: translateY(-50%) translateX(-4px); background: #1d2a23; color: #fff; font-size: 13px; font-weight: 600; padding: 7px 12px; border-radius: 8px; box-shadow: 0 6px 18px rgba(0,0,0,.22); white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .12s, transform .12s; }
    .nav-etq::before { content: ''; position: absolute; left: -5px; top: 50%; margin-top: -5px; border: 5px solid transparent; border-left: 0; border-right-color: #1d2a23; }
    .nav-etq.on { opacity: 1; transform: translateY(-50%) translateX(0); }
    @media (min-width: 821px) {
      .app.menu-min { grid-template-columns: 68px 1fr; }
      .app.menu-min .side { padding: 48px 8px 12px; overflow-x: hidden; }
      .app.menu-min .side-recolher { left: 50%; right: auto; transform: translateX(-50%); }
      .app.menu-min .brand { padding: 6px 0 12px; }
      .app.menu-min .brand .logo-ipb { height: 34px !important; }
      .app.menu-min .brand-txt, .app.menu-min .nav-label, .app.menu-min .nav a .nl, .app.menu-min .side-foot .who, .app.menu-min .side-foot .mode-pill, .app.menu-min #bInstalar, .app.menu-min #bConta, .app.menu-min #bTema { display: none; }
      .app.menu-min .nav a { justify-content: center; padding: 10px 0; position: relative; }
      .app.menu-min .nav a .ni { font-size: 16px; }
      .app.menu-min .nav a .count { position: absolute; top: 2px; right: 4px; margin: 0; font-size: 10px; padding: 0 5px; }
      .app.menu-min .nav-label + a, .app.menu-min .nav-label { margin-top: 0; }
      .app.menu-min .side-foot { padding: 10px 0 0; }
      .app.menu-min .side-foot .row { justify-content: center; margin: 0; }
      .app.menu-min #bSair { padding: 5px 6px; font-size: 11px; }
    }
    .page-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
    .page-head .ph-t { display: flex; gap: 12px; align-items: flex-start; min-width: 0; }
    .voltar { flex: none; width: 38px; height: 38px; margin-top: 2px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface); color: var(--brand); font-size: 20px; line-height: 1; cursor: pointer; display: grid; place-items: center; box-shadow: var(--shadow); }
    .voltar:hover { background: var(--brand-soft); border-color: var(--brand); }
    .page-head p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .mode-pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 3px 9px; border-radius: 99px; background: var(--warn-soft); color: var(--warn); font-weight: 600; }
    .mode-pill.on { background: var(--ok-soft); color: var(--ok); }

    /* ---------- elementos ---------- */
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; }
    .card + .card { margin-top: 16px; }
    .grid > .card + .card, .grid > .card { margin-top: 0; }
    .grid > .card { display: flex; flex-direction: column; }
    .card-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
    .btn { display: inline-flex; align-items: center; gap: 6px; justify-content: center; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); padding: 8px 14px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 500; cursor: pointer; text-decoration: none; white-space: nowrap; }
    .btn:hover { background: var(--surface-2); }
    .btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-contrast); }
    .btn.primary:hover { background: var(--brand-dark); }
    .btn.danger { color: var(--danger); border-color: var(--danger); background: transparent; }
    .btn.danger:hover { background: var(--danger-soft); }
    .btn.ghost { border-color: transparent; background: transparent; }
    .btn.ghost:hover { background: var(--surface-2); }
    .btn.sm { padding: 5px 10px; font-size: 13px; }
    .btn:disabled { opacity: .55; cursor: not-allowed; }
    .badge { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 99px; font-size: 12px; font-weight: 600; white-space: nowrap; }
    .badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .st-Rascunho { background: var(--gray-soft); color: var(--gray); }
    .st-Enviado { background: var(--info-soft); color: var(--info); }
    .st-Em-análise { background: var(--warn-soft); color: var(--warn); }
    .st-Aprovado { background: var(--ok-soft); color: var(--ok); }
    .st-Aprovado-com-ressalvas { background: var(--teal-soft); color: var(--teal); }
    .st-Devolvido { background: var(--danger-soft); color: var(--danger); }
    .tag { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 6px; background: var(--brand-soft); color: var(--brand); font-weight: 600; }
    .tag.gray { background: var(--gray-soft); color: var(--gray); }

    .field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
    .field > label, .lbl { font-size: 13px; font-weight: 600; color: var(--text-2); }
    .field .req { color: var(--danger); }
    .field .help { font-size: 12px; color: var(--muted); }
    input[type=text], input[type=password], input[type=number], input[type=date], input[type=email], input[type=search], select, textarea {
      width: 100%; padding: 8px 10px; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); background: var(--surface); font-size: 14px; min-width: 0;
    }
    textarea { min-height: 84px; resize: vertical; }
    input:disabled, select:disabled, textarea:disabled { background: var(--surface-2); color: var(--text-2); }
    input.invalid, select.invalid, textarea.invalid { border-color: var(--danger); background: var(--danger-soft); }
    .calc { padding: 8px 10px; border-radius: var(--radius-sm); background: var(--brand-soft); color: var(--brand); font-weight: 700; font-variant-numeric: tabular-nums; }
    .grid { display: grid; gap: 16px; }
    /* área da igreja */
    .ig-forms { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
    .ig-form { border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 10px; background: var(--surface-2); }
    .ig-form-t { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; } .ig-form-t b { font-size: 15.5px; }
    .ig-passos { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; counter-reset: p; }
    .ig-passos li { counter-increment: p; font-size: 12px; color: var(--muted); border-top: 4px solid var(--border); padding-top: 5px; }
    .ig-passos li::before { content: counter(p) ". "; font-weight: 700; }
    .ig-passos li.ok { border-color: var(--brand); color: var(--text); } .ig-passos li.at { border-color: #c9902b; color: var(--text); font-weight: 600; }
    tr.ig-ano td { background: var(--surface-2); font-weight: 700; font-family: var(--fonte-ipb); }
    .assin-envio-c { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
    .assin-envio-c img { width: 220px; max-width: 100%; height: auto; background: #fff; border: 1px solid var(--border); border-radius: 8px; }
    /* espaçamento único entre os blocos de cada tela */
    .main > .card, .main > .kpis, .main > .grid, .main > .escopo, .main > .alert, .main > .filters, .main > .fx-li { margin-top: 0; margin-bottom: 16px; }
    .main > :last-child { margin-bottom: 0; }
    .g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .span2 { grid-column: span 2; }
    .span3 { grid-column: 1 / -1; }
    .full { grid-column: 1 / -1; }
    .yesno { display: inline-flex; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); overflow: hidden; width: max-content; }
    .yesno button { border: 0; background: var(--surface); padding: 7px 16px; cursor: pointer; font-size: 14px; }
    .yesno button + button { border-left: 1px solid var(--border-strong); }
    .yesno button.on { background: var(--brand); color: var(--brand-contrast); }
    .yesno button.on.no { background: var(--danger); color: #fff; }
    .yesno button:disabled { cursor: default; }

    .tbl-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius-sm); }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); background: var(--surface-2); font-weight: 600; white-space: nowrap; }
    tr:last-child td { border-bottom: 0; }
    tbody tr.click { cursor: pointer; }
    tbody tr.click:hover td { background: var(--surface-2); }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    .inner-tbl td { padding: 5px 6px; }
    .inner-tbl input, .inner-tbl select { padding: 6px 8px; }

    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; margin-bottom: 16px; }
    .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); text-decoration: none; color: inherit; display: block; }
    .kpi:hover { border-color: var(--border-strong); }
    .kpi .v { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 2px; }
    .kpi .l { font-size: 13px; color: var(--muted); font-weight: 500; }
    .kpi .d { font-size: 12px; margin-top: 2px; }
    .kpis-painel { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .kpis-painel .kpi { display: flex; flex-direction: column; }
    .kpis-painel .kpi .l { min-height: 2.7em; }
    .kpis-painel .kpi .d { font-weight: 600; }
    .kpis-painel .kpi .s { margin-top: auto; padding-top: 6px; }
    @media (max-width: 1000px) { .kpis-painel { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 420px) { .kpis-painel .kpi .l { min-height: 0; } .kpis-painel .kpi { padding: 12px; } }
    .caixa-res { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-bottom: 8px; }
    .caixa-res > div { background: var(--surface-2); border-radius: 8px; padding: 8px 10px; display: flex; flex-direction: column; gap: 2px; }
    .caixa-res span { font-size: 12px; color: var(--muted); } .caixa-res b { font-size: 14px; font-variant-numeric: tabular-nums; white-space: nowrap; }
    @media (max-width: 1200px) { .caixa-res { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    .escopo { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 8px; margin: -4px 0 14px; padding: 10px 14px; border-radius: var(--radius-sm); background: var(--brand-soft); border-left: 4px solid var(--brand); }
    .escopo span { color: var(--muted); font-size: 13px; } .escopo b { font-size: 15px; }
    .escopo.igreja { background: color-mix(in srgb, #c9902b 16%, transparent); border-left-color: #c9902b; }
    .escopo .btn { margin-left: auto; }
    .conf-det { margin-top: 12px; } .conf-det summary { cursor: pointer; color: var(--brand); font-weight: 600; }
    .conf-tab th.c, .conf-tab td.c { text-align: center; font-size: 12px; } .conf-tab th.c { min-width: 82px; white-space: normal; line-height: 1.25; }
    .conf-tab td.c span { font-size: 15px; font-weight: 700; }
    #confBars .bar-row.click { cursor: pointer; border-radius: 6px; } #confBars .bar-row.click:hover { background: var(--surface-2); }
    .up { color: var(--ok); } .down { color: var(--danger); }
    .bar-row { display: grid; grid-template-columns: minmax(110px, 200px) 1fr 44px; gap: 10px; align-items: center; font-size: 13px; padding: 5px 0; }
    .bar { height: 12px; background: var(--surface-2); border-radius: 99px; overflow: hidden; display: flex; }
    .bar i { display: block; height: 100%; }
    .legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--muted); margin-top: 10px; }
    .legend span { display: inline-flex; align-items: center; gap: 5px; }
    .legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
